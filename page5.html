<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اتصل بنا</title>

    <style>
        body {
            font-family: "Arial";
            background-color: #fafafa;
            margin: 20px;
        }

        .nav a {
            text-decoration: none;
            margin-left: 10px;
            font-weight: bold;
            color: #d63a7c;
        }

        .form-box {
            background: white;
            padding: 20px;
            border: 2px solid #d63a7c;
            border-radius: 10px;
            width: 50%;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: #d63a7c;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- روابط الصفحات -->
    <div class="nav">
        <a href="index.html">الصفحة الرئيسية</a> |
        <a href="page2.html">شرح المادة</a> |
        <a href="page3.html">التمارين</a> |
        <a href="page4.html">الأسئلة</a> |
        <a href="page5.html">اتصل بنا</a>
    </div>

    <h1>اتصل بنا</h1>

    <div class="form-box">
        <form>
            <label for="name">الاسم الكامل:</label>
            <input id="name" type="text" placeholder="أدخل اسمك">

            <label for="email">البريد الإلكتروني:</label>
            <input id="email" type="email" placeholder="example@mail.com">

            <label for="msg">الرسالة:</label>
            <textarea id="msg" rows="5" placeholder="اكتب رسالتك هنا..."></textarea>

            <input type="submit" value="إرسال">
        </form>
    </div>

</body>
</html>
