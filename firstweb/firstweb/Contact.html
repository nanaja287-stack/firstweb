<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اتصل بنا</title>

    <!-- ربط ملف CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        h1 {
            text-align: center;
            color: #d4006e;
            margin-top: 30px;
        }

        .contact-box {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px #ffc6dd;
            border: 2px solid #ff8abf;
        }

        .contact-box h2 {
            color: #b30059;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #a3005c;
            display: block;
            margin: 12px 0 5px;
            font-size: 18px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d38ab0;
            font-size: 16px;
            margin-bottom: 15px;
            background: #fff5fa;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            background: #e60073;
            color: white;
            padding: 12px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #cc0066;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<!-- روابط الصفحات -->
<div class="nav">
    <a href="Login.html">تسجيل الدخول</a> |
    <a href="Home.html">الرئيسية</a> |
    <a href="Materials.html">شرح المادة</a> |
    <a href="Quiz1.html">التمارين</a> |
    <a href="Quiz2.html">امتحان</a>
</div>

<h1>📩 تواصل معنا</h1>

<div class="contact-box">
    <h2>📝 نموذج التواصل</h2>

    <!-- 🔥 هنا ربطنا الفورم مع دالة الفحص -->
    <form onsubmit="return checkContact()">

        <label>✍️ الاسم الكامل:</label>
        <input type="text" id="cname" placeholder="اكتب اسمك هنا">

        <label>📧 البريد الإلكتروني:</label>
        <input type="email" id="cemail" placeholder="example@mail.com">

        <label>📞 رقم الهاتف:</label>
        <input type="tel" id="cphone" placeholder="05XXXXXXXX">

        <label>💬 الرسالة:</label>
        <textarea id="cmsg" placeholder="اكتب رسالتك هنا"></textarea>

        <button type="submit">إرسال</button>
    </form>
</div>

<!-- 🔥 ربط ملف الجافاسكربت -->
<script src="JAVA.JS"></script>

</body>
</html>
