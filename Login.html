<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>

    <style>
        body {
            font-family: "Cairo", sans-serif;
            background: linear-gradient(135deg, #ffe6f2, #ffb3d9);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 14px;
            box-shadow: 0 0 12px #ff99cc;
            text-align: center;
        }

        h2 {
            color: #b30059;
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ff77aa;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #ff4d94;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e60073;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>🔐 تسجيل الدخول</h2>

    <input type="text" placeholder="اسم المستخدم">
    <input type="password" placeholder="كلمة المرور">

    <button onclick="window.location.href='index.html'">دخول</button>
</div>

</body>
</html>
